<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f13">
<title>Lounge Shift</title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0eef8;
    --text2: #9896aa;
    --text3: #5c5a6e;
    --pink: #e06b9a;
    --pink-bg: rgba(224,107,154,0.15);
    --pink-border: rgba(224,107,154,0.4);
    --blue: #5b9cf6;
    --blue-bg: rgba(91,156,246,0.15);
    --blue-border: rgba(91,156,246,0.4);
    --gold: #f0b429;
    --gold-bg: rgba(240,180,41,0.18);
    --gold-border: rgba(240,180,41,0.5);
    --green: #34d399;
    --red: #f87171;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'Hiragino Koshi', 'Hiragino Sans', 'Yu Gothic', sans-serif; min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
  
  /* Header */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 16px 0; position: sticky; top: 0; z-index: 100; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .app-title { font-size: 17px; font-weight: 700; letter-spacing: 0.04em; }
  .app-title span { color: var(--pink); }
  .month-nav { display: flex; align-items: center; gap: 10px; }
  .month-nav button { background: var(--surface2); border: 1px solid var(--border2); color: var(--text); border-radius: var(--radius-sm); width: 32px; height: 32px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .month-label { font-size: 15px; font-weight: 600; min-width: 90px; text-align: center; }
  .tabs { display: flex; gap: 0; }
  .tab { flex: 1; padding: 10px 0; text-align: center; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--text2); border-bottom: 2px solid transparent; transition: all 0.2s; }
  .tab.active.cast { color: var(--pink); border-color: var(--pink); }
  .tab.active.boy { color: var(--blue); border-color: var(--blue); }

  /* Main */
  .main { padding: 16px; max-width: 700px; margin: 0 auto; }

  /* Summary cards */
  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .sum-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .sum-card.alert-cast { border-color: var(--pink-border); background: var(--pink-bg); }
  .sum-card.alert-boy  { border-color: var(--blue-border); background: var(--blue-bg); }
  .sum-label { font-size: 11px; color: var(--text2); margin-bottom: 6px; line-height: 1.4; }
  .sum-val { font-size: 26px; font-weight: 700; }
  .sum-val.alert { color: var(--gold); }

  /* Section */
  .section-title { font-size: 12px; color: var(--text3); letter-spacing: 0.06em; margin-bottom: 10px; text-transform: uppercase; }

  /* Add member */
  .add-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .add-row input { flex: 1; background: var(--surface); border: 1px solid var(--border2); color: var(--text); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 15px; outline: none; }
  .add-row input:focus { border-color: var(--pink); }
  .add-row input.boy-mode:focus { border-color: var(--blue); }
  .add-row button { background: var(--surface); border: 1px solid var(--border2); color: var(--text); border-radius: var(--radius-sm); padding: 10px 16px; font-size: 14px; cursor: pointer; white-space: nowrap; }

  /* Member rows */
  .member-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .member-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .member-header { display: flex; align-items: center; padding: 10px 12px; gap: 10px; border-bottom: 1px solid var(--border); }
  .member-name { font-size: 15px; font-weight: 600; flex: 1; }
  .half-badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
  .half-badge.cast { background: var(--pink-bg); color: var(--pink); border: 1px solid var(--pink-border); }
  .half-badge.cast.over { background: var(--gold-bg); color: var(--gold); border: 1px solid var(--gold-border); }
  .half-badge.boy { background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-border); }
  .half-badge.boy.over { background: var(--gold-bg); color: var(--gold); border: 1px solid var(--gold-border); }
  .del-btn { background: none; border: none; color: var(--text3); font-size: 18px; cursor: pointer; padding: 4px; line-height: 1; }
  .del-btn:active { color: var(--red); }
  .days-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 5px; padding: 10px 12px; }
  .day-btn { aspect-ratio: 1; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface2); color: var(--text2); font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.12s; user-select: none; -webkit-user-select: none; }
  .day-btn:active { transform: scale(0.9); }
  .day-btn.on.cast { background: var(--pink); border-color: var(--pink); color: #fff; font-weight: 700; box-shadow: 0 0 8px rgba(224,107,154,0.4); }
  .day-btn.on.boy  { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; box-shadow: 0 0 8px rgba(91,156,246,0.4); }

  /* Calendar */
  .cal-wrap { margin-bottom: 16px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 11px; color: var(--text3); padding: 4px 0; }
  .cal-cell { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 5px; min-height: 60px; }
  .cal-cell.empty { background: transparent; border-color: transparent; }
  .cal-date { font-size: 11px; color: var(--text2); margin-bottom: 4px; font-weight: 500; }
  .cal-count { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 10px; margin-bottom: 3px; }
  .cal-count.cast { background: var(--pink-bg); color: var(--pink); }
  .cal-count.boy  { background: var(--blue-bg); color: var(--blue); }
  .cal-names { font-size: 10px; color: var(--text2); line-height: 1.6; }

  /* Loading */
  .loading { text-align: center; padding: 40px; color: var(--text2); font-size: 14px; }
  .dot-loader { display: inline-flex; gap: 5px; }
  .dot-loader span { width: 6px; height: 6px; background: var(--text3); border-radius: 50%; animation: dot 1.2s infinite; }
  .dot-loader span:nth-child(2) { animation-delay: 0.2s; }
  .dot-loader span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot { 0%,80%,100%{opacity:0.2;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }

  .panel { display: none; }
  .panel.active { display: block; }

  /* Divider */
  .divider { font-size: 12px; color: var(--text3); margin: 20px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); letter-spacing: 0.04em; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="app-title">Lounge <span>Shift</span></div>
    <div class="month-nav">
      <button id="prev-btn">&#8249;</button>
      <div class="month-label" id="month-label"></div>
      <button id="next-btn">&#8250;</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active cast" data-tab="cast" onclick="switchTab('cast')">&#10084; キャスト</div>
    <div class="tab boy" data-tab="boy" onclick="switchTab('boy')">&#9675; ボーイ</div>
  </div>
</div>

<div class="main">
  <div id="loading" class="loading">
    <div class="dot-loader"><span></span><span></span><span></span></div>
    <div style="margin-top:12px">読み込み中...</div>
  </div>

  <div id="panel-cast" class="panel"></div>
  <div id="panel-boy"  class="panel"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJfMxzVFWOdn8i-eSTqcIphMpXNO6gXDw",
  authDomain: "lounge-shift.firebaseapp.com",
  projectId: "lounge-shift",
  storageBucket: "lounge-shift.firebasestorage.app",
  messagingSenderId: "704253767249",
  appId: "1:704253767249:web:176f3dc975edb8e5719270"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

let currentYear  = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let currentTab   = 'cast';
let saving       = false;

// state: { cast: { members:[], shifts:{} }, boy: { members:[], shifts:{} } }
let state = { cast: { members: [], shifts: {} }, boy: { members: [], shifts: {} } };

const MONTHS_JP = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const DOW       = ['日','月','火','水','木','金','土'];

// ── Firestore helpers ────────────────────────────
function docId() { return `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`; }

async function loadMonth() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('panel-cast').classList.remove('active');
  document.getElementById('panel-boy').classList.remove('active');

  const ref = doc(db, 'shifts', docId());
  const snap = await getDoc(ref);
  if (snap.exists()) {
    const d = snap.data();
    state.cast = d.cast || { members: [], shifts: {} };
    state.boy  = d.boy  || { members: [], shifts: {} };
  } else {
    state.cast = { members: [], shifts: {} };
    state.boy  = { members: [], shifts: {} };
  }
  document.getElementById('loading').style.display = 'none';
  render();
}

async function saveMonth() {
  if (saving) return;
  saving = true;
  try {
    await setDoc(doc(db, 'shifts', docId()), {
      cast: state.cast,
      boy:  state.boy,
      updatedAt: new Date().toISOString()
    });
  } catch(e) { console.error(e); }
  saving = false;
}

// ── Helpers ──────────────────────────────────────
function daysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
function firstDow(y, m)    { return new Date(y, m, 1).getDay(); }

function getShifts(role, name) {
  if (!state[role].shifts[name]) state[role].shifts[name] = [];
  return state[role].shifts[name];
}

// ── Actions ──────────────────────────────────────
window.toggleDay = function(role, name, day) {
  const arr = getShifts(role, name);
  const idx = arr.indexOf(day);
  if (idx === -1) arr.push(day);
  else arr.splice(idx, 1);
  render();
  saveMonth();
};

window.addMember = function(role) {
  const inp = document.getElementById('inp-' + role);
  const n   = inp.value.trim();
  if (!n || state[role].members.includes(n)) { inp.value = ''; return; }
  state[role].members.push(n);
  inp.value = '';
  render();
  saveMonth();
};

window.deleteMember = function(role, name) {
  if (!confirm(`「${name}」を削除しますか？`)) return;
  state[role].members = state[role].members.filter(m => m !== name);
  delete state[role].shifts[name];
  render();
  saveMonth();
};

window.switchTab = function(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  document.getElementById('panel-cast').classList.toggle('active', tab === 'cast');
  document.getElementById('panel-boy').classList.toggle('active',  tab === 'boy');
};

window.changeMonth = function(delta) {
  currentMonth += delta;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
  document.getElementById('month-label').textContent = `${currentYear}年 ${MONTHS_JP[currentMonth]}`;
  loadMonth();
};

// ── Render ───────────────────────────────────────
function buildPanel(role) {
  const isGirl = role === 'cast';
  const accent = isGirl ? 'cast' : 'boy';
  const total  = daysInMonth(currentYear, currentMonth);
  const fd     = firstDow(currentYear, currentMonth);

  // Summary totals
  let h1 = 0, h2 = 0;
  state[role].members.forEach(name => {
    const s = getShifts(role, name);
    h1 += s.filter(d => d >= 1  && d <= 15).length;
    h2 += s.filter(d => d >= 16 && d <= total).length;
  });

  const alertClass1 = h1 >= 10 ? `alert-${accent}` : '';
  const alertClass2 = h2 >= 10 ? `alert-${accent}` : '';
  const valClass1   = h1 >= 10 ? 'alert' : '';
  const valClass2   = h2 >= 10 ? 'alert' : '';

  let html = `
  <div class="summary">
    <div class="sum-card ${alertClass1}">
      <div class="sum-label">1〜15日<br>出勤数（延べ）</div>
      <div class="sum-val ${valClass1}">${h1}<span style="font-size:14px;font-weight:400;color:var(--text2)"> 日</span></div>
    </div>
    <div class="sum-card ${alertClass2}">
      <div class="sum-label">16〜${total}日<br>出勤数（延べ）</div>
      <div class="sum-val ${valClass2}">${h2}<span style="font-size:14px;font-weight:400;color:var(--text2)"> 日</span></div>
    </div>
  </div>

  <div class="divider">メンバー管理</div>
  <div class="add-row">
    <input id="inp-${role}" class="${isGirl ? '' : 'boy-mode'}" placeholder="名前を追加"
      onkeydown="if(event.key==='Enter')addMember('${role}')">
    <button onclick="addMember('${role}')">＋ 追加</button>
  </div>

  <div class="member-list">`;

  state[role].members.forEach(name => {
    const s  = getShifts(role, name);
    const c1 = s.filter(d => d <= 15).length;
    const c2 = s.filter(d => d >= 16 && d <= total).length;
    const over1 = c1 >= 10 ? 'over' : '';
    const over2 = c2 >= 10 ? 'over' : '';

    html += `
    <div class="member-card">
      <div class="member-header">
        <div class="member-name">${name}</div>
        <span class="half-badge ${accent} ${over1}">前半 ${c1}</span>
        <span class="half-badge ${accent} ${over2}">後半 ${c2}</span>
        <button class="del-btn" onclick="deleteMember('${role}','${name}')">×</button>
      </div>
      <div class="days-grid">`;

    for (let d = 1; d <= total; d++) {
      const on = s.includes(d) ? `on ${accent}` : '';
      html += `<button class="day-btn ${on}" onclick="toggleDay('${role}','${name}',${d})">${d}</button>`;
    }

    html += `</div></div>`;
  });

  html += `</div>`;

  // Calendar view
  html += `<div class="divider">日別出勤一覧</div><div class="cal-wrap"><div class="cal-grid">`;
  DOW.forEach(d => { html += `<div class="cal-dow">${d}</div>`; });
  for (let i = 0; i < fd; i++) html += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= total; d++) {
    const attending = state[role].members.filter(n => getShifts(role, n).includes(d));
    html += `<div class="cal-cell">
      <div class="cal-date">${d}</div>
      <div class="cal-count ${accent}">${attending.length}名</div>
      <div class="cal-names">${attending.join('<br>')}</div>
    </div>`;
  }
  const rem = (fd + total) % 7;
  if (rem > 0) for (let i = 0; i < 7 - rem; i++) html += `<div class="cal-cell empty"></div>`;
  html += `</div></div>`;

  return html;
}

function render() {
  document.getElementById('panel-cast').innerHTML = buildPanel('cast');
  document.getElementById('panel-boy').innerHTML  = buildPanel('boy');
  // Restore active tab
  document.getElementById(`panel-${currentTab}`).classList.add('active');
}

// ── Init ─────────────────────────────────────────
document.getElementById('month-label').textContent = `${currentYear}年 ${MONTHS_JP[currentMonth]}`;
document.getElementById('prev-btn').onclick = () => changeMonth(-1);
document.getElementById('next-btn').onclick = () => changeMonth(1);
loadMonth();
</script>
</body>
</html>
